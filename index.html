<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="隨手複製">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>隨手複製</title>
<style>
:root{--bg:#14181c;--panel:#1d2329;--fg:#eef1f3;--dim:#8d99a3;--acc:#ffd23f;--sel:rgba(255,210,63,.38)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.view{position:fixed;inset:0;display:none;flex-direction:column;padding:inherit}
.view.on{display:flex}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid #38424b;border-radius:10px;padding:10px 16px;cursor:pointer}
button.pri{background:var(--acc);color:#14181c;border-color:var(--acc);font-weight:700}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#captureInfo{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:72px 24px 24px;text-align:center;color:var(--dim)}
#captureInfo strong{color:var(--fg);font-size:20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--bg)}
#capture{flex:1}
/* result */
#imgWrap{position:relative;flex:1;min-height:0;overflow:hidden;background:#000;touch-action:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-select:none;line-height:0}
#stage img{width:100%;height:100%;display:block;pointer-events:none}
#zc{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:3}
#zc button{padding:4px 12px;background:rgba(20,24,28,.82)}
#imgWrap.mv{cursor:grab}
#stage .w{position:absolute;border:1px solid rgba(255,255,255,.35);border-radius:2px;pointer-events:none}
#stage .w.s{background:var(--sel);border-color:var(--acc)}
#rect{position:absolute;border:2px dashed var(--acc);background:rgba(255,210,63,.12);display:none;pointer-events:none}
.hint{padding:6px 16px;font-size:13px;color:var(--dim);background:var(--panel)}
#txt{width:100%;height:30vh;background:var(--panel);color:var(--fg);border:0;padding:12px 16px;font:inherit;resize:none}
#txt:focus{outline:none}
#prog{position:fixed;inset:0;background:rgba(20,24,28,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5}
#prog.on{display:flex}
#pbar{width:60%;max-width:320px;height:6px;background:#38424b;border-radius:3px;overflow:hidden}
#pbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--acc);color:#14181c;padding:8px 18px;border-radius:20px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
#status{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:2}
#status>*{pointer-events:auto;background:rgba(20,24,28,.78);border-radius:16px;padding:4px 12px;font-size:13px}
#install{display:none;color:#14181c;background:var(--acc);font-weight:700;border:0}
#upd{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);display:none;align-items:center;justify-content:space-between;gap:12px;background:var(--acc);color:#14181c;padding:10px 14px;border-radius:12px;z-index:20;font-weight:700}
#upd button{background:#14181c;color:var(--fg);border:0;padding:6px 14px}
#ios{display:none;position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:var(--panel);border:1px solid #38424b;padding:12px 14px;border-radius:12px;z-index:20;font-size:14px}
select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid #38424b;border-radius:10px;padding:9px 8px}
/* live camera */
#liv{background:#000}
#liveWrap{position:relative;flex:1;min-height:0;background:#000;display:flex}
#live{width:100%;height:100%;object-fit:contain;background:#000}
#livTop{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:2}
#livTop button,#livTop select{background:rgba(20,24,28,.78)}
#camSel{flex:1;min-width:0;text-overflow:ellipsis}
#zoomBar{position:absolute;left:16px;right:16px;bottom:12px;display:none;align-items:center;gap:10px;background:rgba(20,24,28,.7);border-radius:20px;padding:6px 14px;z-index:2}
#zoomBar input{flex:1;accent-color:var(--acc)}
#zoomVal{min-width:3.2em;text-align:right;font-size:13px}
.livbar{display:grid;grid-template-columns:1fr auto 1fr;gap:12px}
.livbar>:first-child{justify-self:start}
.livbar>:last-child{justify-self:end}
#shutter{width:72px;height:72px;border-radius:50%;padding:0;background:var(--acc);border:4px solid #14181c;box-shadow:0 0 0 3px var(--acc)}
#shutter:disabled{opacity:.5}
button:disabled{opacity:.45;cursor:default}
#resBar{padding:12px}
#resBar button{padding:8px 11px}
#resMain{flex:1;min-height:0;display:flex;flex-direction:column}
#side{display:flex;flex-direction:column;min-height:0}
.opts{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 16px;background:var(--panel);border-top:1px solid #2a323a;font-size:13px;color:var(--dim)}
.opts label{display:flex;align-items:center;gap:5px;cursor:pointer}
.opts input{accent-color:var(--acc)}
#stage .w.lo{border-color:#ff9f43;border-style:dashed}
.opts select{padding:2px 6px;font-size:13px;border-radius:6px}
.engLbl{margin-top:10px;font-size:14px;color:var(--dim);display:flex;align-items:center;gap:8px}
.pcHint{display:none;color:var(--acc);font-size:14px;margin-top:6px}
@media (pointer:fine){.pcHint{display:block}}
#snip{background:#000}
#snipBar{flex-wrap:wrap}
#snipHint{color:var(--dim);font-size:14px;flex:1;text-align:center;min-width:160px}
#snipBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0b0e11}
#snipWrap{position:relative;line-height:0;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
#snipCv{display:block}
#snipSel{position:absolute;border:2px dashed var(--acc);background:rgba(255,210,63,.15);display:none;pointer-events:none}
#drop{position:fixed;inset:10px;display:none;align-items:center;justify-content:center;border:3px dashed var(--acc);border-radius:16px;background:rgba(20,24,28,.85);color:var(--acc);font-size:22px;font-weight:700;z-index:8;pointer-events:none}
#drop.on{display:flex}
@media (min-width:900px){
  #resMain{flex-direction:row}
  #imgWrap{min-width:0}
  #side{width:clamp(340px,38vw,560px);border-left:1px solid #2a323a}
  #txt{flex:1;height:auto;min-height:0}
}
</style>
</head>
<body>

<section id="cam" class="view on">
  <div id="status"><span id="net"></span><button id="install">安裝 App</button></div>
  <div id="captureInfo"><strong>拍照後立即辨識文字</strong><span>即時預覽拍攝（可切換鏡頭並自動記憶），或選擇裝置中的照片</span><label class="engLbl">辨識引擎 <select id="eng" aria-label="辨識引擎"><option value="pp">高準確（PaddleOCR）</option><option value="pp1">高準確・快速</option><option value="tess">輕量（Tesseract）</option></select></label>
    <span class="pcHint">電腦：按 Ctrl+V 貼上圖片，或把圖片檔拖進視窗</span></div>
  <div class="bar">
    <select id="lang" aria-label="辨識語言">
      <option value="chi_tra+eng">繁中＋英文</option>
      <option value="eng">僅英文（較快）</option>
    </select>
    <button class="pri" id="capture">拍照辨識</button>
    <button id="snipBtn" style="display:none" title="擷取螢幕或視窗，框選後辨識">擷取螢幕</button>
    <button id="pick">選照片</button>
  </div>
  <input id="file" type="file" accept="image/*" hidden>
  <input id="cameraFile" type="file" accept="image/*" capture="environment" hidden>
</section>

<section id="liv" class="view">
  <div id="liveWrap">
    <video id="live" playsinline muted autoplay></video>
    <div id="livTop"><button id="livBack">返回</button><select id="camSel" aria-label="切換鏡頭"></select></div>
    <div id="zoomBar"><span>縮放</span><input type="range" id="zoom" aria-label="縮放"><span id="zoomVal"></span></div>
  </div>
  <div class="bar livbar">
    <select id="lang2" aria-label="辨識語言">
      <option value="chi_tra+eng">繁中＋英文</option>
      <option value="eng">僅英文（較快）</option>
    </select>
    <button id="shutter" aria-label="拍照"></button>
    <button id="pick2">選照片</button>
  </div>
</section>

<section id="snip" class="view">
  <div class="bar" id="snipBar">
    <button id="snipBack">取消</button>
    <span id="snipHint">拖曳選取要辨識的區域；Enter 辨識、Esc 取消</span>
    <span><button id="snipAll">整張辨識</button> <button class="pri" id="snipGo" disabled>辨識選取區</button></span>
  </div>
  <div id="snipBox"><div id="snipWrap"><canvas id="snipCv" width="1" height="1"></canvas><div id="snipSel"></div></div></div>
</section>

<section id="res" class="view">
  <div class="bar" id="resBar">
    <button id="retake">重拍</button>
    <button id="selAll">全選</button>
    <button id="clear">清除選取</button>
    <button id="reBtn" disabled title="先拖曳框選一塊區域，再用原圖解析度重新辨識">重辨框選區</button>
  </div>
  <div id="resMain">
  <div id="imgWrap"><div id="stage"><img id="shot" alt="拍攝的照片"><div id="rect"></div></div>
    <div id="zc"><button id="mO" aria-label="縮小">－</button><button id="mZ" aria-label="放大">＋</button><button id="mFit">適合</button><button id="mMove">移動</button></div></div>
  <div id="side">
  <div class="hint" id="hint">拖曳框選範圍、點一下選單字；框選後可按「重辨框選區」用原圖解析度重辨（橘色虛線＝低信心）</div>
  <textarea id="txt" spellcheck="false" aria-label="辨識結果"></textarea>
  <div class="opts">
    <label id="accLbl" title="實驗功能：偵測模型只能跑 CPU，只有辨識／方向分類走 GPU，不一定比較快；請看右下角顯示的秒數自行比較。失敗會自動改用 CPU">加速 <select id="acc" aria-label="加速方式"><option value="cpu">CPU（預設）</option><option value="auto">WebGPU（實驗）</option></select></label>
    <label>引擎 <select id="eng2" aria-label="辨識引擎"><option value="pp">高準確（PaddleOCR）</option><option value="pp1">高準確・快速</option><option value="tess">輕量（Tesseract）</option></select></label>
    <label><input type="checkbox" id="oBreak" checked>保留換行</label>
    <label><input type="checkbox" id="oSpace" checked>去除中文間空格</label>
    <label><input type="checkbox" id="oPunc">中文標點修正</label>
    <label id="enhLbl" title="僅 Tesseract 使用"><input type="checkbox" id="oEnh" checked>影像增強</label>
  </div>
  <div class="bar"><span id="count" style="color:var(--dim)"></span><button class="pri" id="copy">複製文字</button></div>
  </div></div>
</section>

<div id="drop">放開以辨識圖片</div>
<div id="prog"><div id="pmsg">準備中…</div><div id="pbar"><i></i></div></div>
<div id="toast">已複製</div>
<div id="upd"><span>有新版本可用</span><button id="updBtn">立即更新</button></div>
<div id="ios">要安裝：點瀏覽器的「分享」→「加入主畫面」 <button id="iosX" style="margin-left:8px;padding:2px 10px">關閉</button></div>

<script src="vendor/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let stage=$('stage'),shot=$('shot'),rectEl=$('rect'),txt=$('txt');
let words=[],lines=[],lineObjs=[],sel=new Set(),imgW=1,imgH=1,boxEls=[],orig=null,lastRect=null,shotUrl=null,lastMode='cam';

/* ---------- storage helper ---------- */
const LSK={cam:'ocrCam',camLabel:'ocrCamLabel',zoom:'ocrZoom',lang:'ocrLang',eng:'ocrEng',acc:'ocrAccel'};
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};

/* ---------- image picker (and native camera as fallback) ---------- */
$('pick').onclick=()=>$('file').click();
function loadFile(f){
  if(!f)return;
  lastMode='cam';$('retake').textContent='重拍';
  stopCam();
  if($('liv').classList.contains('on'))show('cam');
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(url);run(im,im.naturalWidth,im.naturalHeight)};
  im.onerror=()=>{URL.revokeObjectURL(url);toast('無法讀取這張圖片')};
  im.src=url;
}
function openImage(input){const f=input.files[0];input.value='';loadFile(f)}
['file','cameraFile'].forEach(id=>$(id).onchange=e=>openImage(e.currentTarget));

/* ---------- OCR (all assets self-hosted under vendor/) ---------- */
const abs=p=>new URL(p,location.href).href.replace(/\/$/,'');
const STAT={'loading tesseract core':'載入辨識引擎…','loading language traineddata':'載入語言資料…','initializing api':'初始化…','recognizing text':'辨識中…'};
let wkP=null,wkLang='',quiet=false;
function getWorker(lang,silent){
  if(wkP&&wkLang===lang){if(!silent)quiet=false;return wkP}
  const old=wkP;wkLang=lang;quiet=!!silent;
  const mine=wkP=(async()=>{
    if(old){try{(await old).terminate()}catch{}}
    const w=await Tesseract.createWorker(lang,1,{
      workerPath:abs('vendor/worker.min.js'),corePath:abs('vendor/core'),langPath:abs('vendor/lang'),
      workerBlobURL:false,cacheMethod:'none',
      logger:m=>{if(!quiet)setProg(true,STAT[m.status]||m.status,m.progress||0)}
    });
    try{await w.setParameters({user_defined_dpi:'300'})}catch{}
    return w;
  })();
  mine.catch(()=>{if(wkP===mine){wkP=null;wkLang=''}});
  return mine;
}
// 預熱：提早載入引擎與語言資料，拍完照就能直接辨識
let warmed=false;
function warm(){
  warmed=true;
  if(engine()==='tess'){if(window.Tesseract)getWorker($('lang').value,true).catch(()=>{});return}
  ppQuiet=true;paddleInit().catch(()=>{});
}
function idleWarm(){
  if(warmed)return;
  (window.requestIdleCallback||(f=>setTimeout(f,300)))(()=>{
    if(warmed||document.hidden)return;
    if(engine()==='tess')warm();
    else caches.match('vendor/paddle/PP-OCRv5_mobile_rec_infer.onnx').then(h=>{if(h&&!warmed)warm()}).catch(()=>{});   // 已快取才預熱，避免偷偷下載
  });
}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v))}
const MAXO=matchMedia('(pointer:coarse)').matches?1600:2400;   // 電腦用較大的辨識尺寸
function setLines(lo){
  lineObjs=lo;words=lo.flat();
  const m=new Map(words.map((w,i)=>[w,i]));
  lines=lo.map(l=>l.map(w=>m.get(w)));
}
/* ---------- 辨識引擎：PaddleOCR（Web Worker）／Tesseract ---------- */
let pw=null,pwP=null,pwId=0,pwCb=new Map(),ppBroken=false,ppQuiet=true,ppBackend='',lastInfo='';
function engine(){const v=$('eng').value;return ppBroken?'tess':v}
function paddleInit(){
  if(pwP)return pwP;
  pwP=new Promise((res,rej)=>{
    let w;try{w=new Worker('vendor/paddle/worker.mjs',{type:'module'})}catch(e){return rej(e)}
    pw=w;
    w.onmessage=e=>{
      const m=e.data;
      if(m.t==='ready'){ppBackend=m.backend;res(w)}
      else if(m.t==='stage'){if(!ppQuiet)setProg(true,m.text,m.f)}
      else if(m.t==='fallback'){console.warn('WebGPU 退回 CPU：',m.reason);ls.set(LSK.acc,'cpu');$('acc').value='cpu';toast('WebGPU 無法使用，已改用 CPU')}
      else if(m.t==='load'){if(!ppQuiet)setProg(true,'下載高準確辨識引擎…（首次約 37MB，之後可離線）',m.f)}
      else if(m.t==='initfail')rej(new Error(m.message));
      else if(m.t==='prog'){const cb=pwCb.get(m.id);if(cb)cb.prog(m)}
      else if(m.t==='result'){const cb=pwCb.get(m.id);pwCb.delete(m.id);ppBackend=m.backend||ppBackend;if(cb)cb.res(m.lines)}
      else if(m.t==='error'){const cb=pwCb.get(m.id);pwCb.delete(m.id);if(cb)cb.rej(new Error(m.message))}
    };
    w.onerror=e=>rej(new Error(e.message||'worker error'));
    w.postMessage({t:'init',accel:$('acc').value});
  });
  pwP.catch(()=>{if(pw)pw.terminate();pw=null;pwP=null});
  return pwP;
}
const PP_LABEL={det:'偵測文字…',cls:'判斷方向…',rec:'辨識文字…'};
async function paddleLines(c,opts){
  ppQuiet=false;
  const w=await paddleInit();
  const t0=performance.now();
  const id=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height),rid=++pwId;
  const res=await new Promise((resolve,reject)=>{
    pwCb.set(rid,{res:resolve,rej:reject,prog:m=>setProg(true,PP_LABEL[m.stage]||'辨識中…',m.f)});
    w.postMessage({t:'run',id:rid,rgba:id.data.buffer,w:c.width,h:c.height,opts},[id.data.buffer]);
  });
  lastInfo=(ppBackend==='webgpu'?'WebGPU ':'CPU ')+((performance.now()-t0)/1000).toFixed(1)+' 秒';
  return ppToLines(res);
}
// PaddleOCR 的字元框 → 本程式的「字詞」：每個中日文字自成一詞，連續英數合成一詞
function ppToLines(res){
  return res.map(l=>{
    const out=[];let cur=null;
    const flush=()=>{if(cur){cur.confidence=cur.ps.reduce((a,b)=>a+b,0)/cur.ps.length*100;cur.low=cur.confidence<70;delete cur.ps;out.push(cur);cur=null}};
    l.chars.forEach(c=>{
      if(!c.ch.trim()){flush();return}
      const bb={x0:c.bbox[0],y0:c.bbox[1],x1:c.bbox[2],y1:c.bbox[3]};
      if(CJK.test(c.ch)){flush();cur={text:c.ch,bbox:bb,ps:[c.p]};flush()}
      else if(cur){cur.text+=c.ch;cur.ps.push(c.p);const b=cur.bbox;b.x0=Math.min(b.x0,bb.x0);b.y0=Math.min(b.y0,bb.y0);b.x1=Math.max(b.x1,bb.x1);b.y1=Math.max(b.y1,bb.y1)}
      else cur={text:c.ch,bbox:bb,ps:[c.p]};
    });
    flush();return out;
  }).filter(l=>l.length);
}
// region：重辨框選區時傳入 {psm}（僅 Tesseract 使用）
async function recognizeLines(c,region){
  if(engine()!=='tess'){
    try{return await paddleLines(c,{detScales:(engine()==='pp'&&!region)?[960,1536]:[1280],alsoLine:!!region})}
    catch(err){console.error(err);ppBroken=true;syncEngUI();toast('高準確引擎無法使用，改用 Tesseract');quiet=false;setProg(true,'載入辨識引擎…',0)}
  }
  lastInfo='';
  if($('oEnh').checked&&!c._enh){enhance(c);c._enh=true}
  const worker=await getWorker($('lang').value);
  if(region)await worker.setParameters({tessedit_pageseg_mode:region.psm});
  try{const {data}=await worker.recognize(c,{},OUT);return toLines(data)}
  finally{if(region)try{await worker.setParameters({tessedit_pageseg_mode:'3'})}catch{}}
}
// tesseract.js v6+：結果在 data.blocks（區塊→段落→行→字詞），需在 recognize 第三個參數開啟
const OUT={blocks:true};
function toLines(data){
  const out=[];
  (data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>out.push(l.words||[]))));
  return out.map(ws=>ws.filter(x=>x.text&&x.text.trim()&&x.confidence>10).map(x=>{x.low=x.confidence<55;return x})).filter(l=>l.length);
}
// 灰階＋對比拉伸；背景偏暗（深色模式截圖）時自動反相
function enhance(c){
  const g=c.getContext('2d',{willReadFrequently:true});
  const id=g.getImageData(0,0,c.width,c.height),d=id.data,n=c.width*c.height,hist=new Uint32Array(256);
  for(let i=0,j=0;i<n;i++,j+=4){const y=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;d[j]=y;hist[y]++}
  let lo=0,hi=255,acc=0,sum=0;
  for(let v=0;v<256;v++){acc+=hist[v];sum+=v*hist[v];if(!lo&&acc>=n*.01)lo=v}
  acc=0;for(let v=0;v<256;v++){acc+=hist[v];if(acc>=n*.99){hi=v;break}}
  if(hi-lo<30){lo=0;hi=255}
  const dark=sum/n<90,s=255/(hi-lo),lut=new Uint8ClampedArray(256);
  for(let v=0;v<256;v++){const o=(v-lo)*s;lut[v]=dark?255-o:o}
  for(let i=0,j=0;i<n;i++,j+=4){const y=lut[d[j]];d[j]=d[j+1]=d[j+2]=y}
  g.putImageData(id,0,0);
}
async function run(src,w,h){
  // 保留一份原圖（最長邊 4096），框選重辨與放大檢視都用它
  const k0=Math.min(1,4096/Math.max(w,h));
  orig=document.createElement('canvas');orig.width=Math.round(w*k0);orig.height=Math.round(h*k0);
  const g=orig.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(src,0,0,orig.width,orig.height);
  imgW=orig.width;imgH=orig.height;lastRect=null;
  txt.value='';words=[];lineObjs=[];lines=[];sel.clear();clearBoxes();updateBtns();
  show('res');fit();
  const big=Math.max(orig.width,orig.height)>2000;
  const blob=await new Promise(r=>orig.toBlob(r,big?'image/jpeg':'image/png',.92));
  if(shotUrl)URL.revokeObjectURL(shotUrl);
  shotUrl=URL.createObjectURL(blob);shot.src=shotUrl;
  await ocrFull();
}
async function ocrFull(){
  const W=orig.width,H=orig.height,side=Math.max(W,H);
  let k=side>MAXO?MAXO/side:(side<1200?2:1);   // 太大縮小；小字截圖放大 2 倍
  if(lastMode==='screen'&&side<=MAXO)k=Math.min(2,MAXO/side);   // 螢幕文字通常很小，盡量放大
  const c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);
  const g=c.getContext('2d',{willReadFrequently:true});g.imageSmoothingQuality='high';g.drawImage(orig,0,0,c.width,c.height);
  imgW=c.width;imgH=c.height;
  txt.value='';words=[];lineObjs=[];lines=[];sel.clear();lastRect=null;clearBoxes();updateBtns();
  quiet=false;setProg(true,'載入辨識引擎…',0);
  try{
    setLines(await recognizeLines(c,null));
    buildBoxes();refresh();
    if(!words.length)toast('沒有辨識到文字');
  }catch(e){
    console.error(e);wkP=null;wkLang='';txt.value='辨識失敗：'+(e.message||e)+'\n（請確認 vendor/ 資料夾已完整上傳）';
  }
  setProg(false);
}
function updateBtns(){$('reBtn').disabled=!lastRect}
function inside(w,r){const cx=(w.bbox.x0+w.bbox.x1)/2,cy=(w.bbox.y0+w.bbox.y1)/2;return cx>=r.x0&&cx<=r.x1&&cy>=r.y0&&cy<=r.y1}
// 框選區域：從原圖裁切、放大、增強後單獨重辨，再換掉該區的舊字詞
async function reocr(){
  if(!lastRect||!orig)return;
  const r=lastRect,sx=orig.width/imgW,sy=orig.height/imgH;
  const x0=Math.max(0,Math.floor(r.x0*sx)-6),y0=Math.max(0,Math.floor(r.y0*sy)-6);
  const x1=Math.min(orig.width,Math.ceil(r.x1*sx)+6),y1=Math.min(orig.height,Math.ceil(r.y1*sy)+6);
  const cw=x1-x0,ch=y1-y0;if(cw<8||ch<8)return;
  const side=Math.max(cw,ch),short=Math.min(cw,ch);
  // Tesseract 愈大愈好（最多 3 倍）；PaddleOCR 內部會縮到固定高度，原圖解析度即可，只有太小才放大
  const k=side>2400?2400/side:(engine()==='tess'?clamp(1600/side,1,3):(short<64?Math.min(3,96/short):1));
  const c=document.createElement('canvas');c.width=Math.round(cw*k);c.height=Math.round(ch*k);
  const g=c.getContext('2d',{willReadFrequently:true});g.imageSmoothingQuality='high';
  g.drawImage(orig,x0,y0,cw,ch,0,0,c.width,c.height);
  quiet=false;setProg(true,'重新辨識中…',0);
  try{
    const lines=await recognizeLines(c,{psm:(cw/ch>8?'7':'6')});   // Tesseract：7=單行 6=單一區塊
    const fresh=lines.map(l=>l.map(w=>({text:w.text,confidence:w.confidence,low:w.low,bbox:{
      x0:(x0+w.bbox.x0/k)/sx,x1:(x0+w.bbox.x1/k)/sx,y0:(y0+w.bbox.y0/k)/sy,y1:(y0+w.bbox.y1/k)/sy}})))
      .map(l=>l.filter(w=>inside(w,r))).filter(l=>l.length);
    if(!fresh.length)toast('框選區沒有辨識到文字');
    else{
      let ins=-1;const kept=[];
      lineObjs.forEach(l=>{const k2=l.filter(w=>!inside(w,r));if(k2.length!==l.length&&ins<0)ins=kept.length;if(k2.length)kept.push(k2)});
      if(ins<0){ins=kept.findIndex(l=>l[0].bbox.y0>r.y0);if(ins<0)ins=kept.length}
      kept.splice(ins,0,...fresh);
      const nw=new Set(fresh.flat());
      setLines(kept);buildBoxes();
      sel=new Set();words.forEach((w,i)=>{if(nw.has(w))sel.add(i)});   // 自動選取新結果
      refresh();
    }
  }catch(e){console.error(e);toast('重新辨識失敗')}
  setProg(false);
}
function setProg(on,msg,p){$('prog').classList.toggle('on',on);if(msg)$('pmsg').textContent=msg;$('pbar').firstChild.style.width=Math.round((p||0)*100)+'%'}

/* ---------- live camera (in-page preview, lens select remembered) ---------- */
const canLive=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
let stream=null,track=null,camBusy=false,liveBroken=false,shooting=false;
function stopCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=track=null;$('live').srcObject=null;
}
async function openCam(id){
  stopCam();
  const video={width:{ideal:1920},height:{ideal:1080}};
  if(id)video.deviceId={exact:id};else video.facingMode={ideal:'environment'};
  stream=await navigator.mediaDevices.getUserMedia({video,audio:false});
  track=stream.getVideoTracks()[0];
  const v=$('live');v.srcObject=stream;
  await v.play().catch(()=>{});
  const caps=track.getCapabilities?track.getCapabilities():{};
  try{if(caps.focusMode&&caps.focusMode.includes('continuous'))await track.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch{}
  setupZoom(caps);
}
function camName(d,i){
  const l=(d.label||'').replace(/facing back/i,'後置').replace(/facing front/i,'前置');
  return (i+1)+'. '+(l||'鏡頭');
}
async function listCams(){return (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput')}
function rememberCam(devs){
  const id=track&&track.getSettings().deviceId;if(!id)return;
  const d=devs.find(x=>x.deviceId===id);
  ls.set(LSK.cam,id);if(d&&d.label)ls.set(LSK.camLabel,d.label);
}
async function startCam(){
  if(camBusy)return;camBusy=true;
  try{
    const saved=ls.get(LSK.cam),savedLabel=ls.get(LSK.camLabel);
    let lost=false;
    try{await openCam(saved||null)}
    catch(e){
      if(!saved)throw e;
      lost=true;await openCam(null);   // 記住的鏡頭 ID 失效，先開預設後鏡頭
    }
    let devs=await listCams();
    if(lost){                          // ID 可能因清除網站資料而改變：改用鏡頭名稱比對
      const m=savedLabel&&devs.find(d=>d.label===savedLabel);
      if(m&&m.deviceId!==(track&&track.getSettings().deviceId)){try{await openCam(m.deviceId)}catch{}}
      devs=await listCams();
      rememberCam(devs);
    }
    $('camSel').innerHTML=devs.map((d,i)=>`<option value="${d.deviceId}">${camName(d,i)}</option>`).join('');
    const cur=track&&track.getSettings().deviceId;
    if(cur)$('camSel').value=cur;
    $('camSel').style.display=devs.length>1?'':'none';
  }catch(e){
    console.error(e);liveBroken=true;stopCam();show('cam');
    toast(e&&e.name==='NotAllowedError'?'相機權限被拒，改用系統相機':'無法開啟即時相機，改用系統相機');
  }
  camBusy=false;
}
function openLive(){
  lastMode='cam';$('retake').textContent='重拍';
  warm();
  if(!canLive||liveBroken){$('cameraFile').click();return}
  show('liv');startCam();
}
$('capture').onclick=openLive;
$('livBack').onclick=()=>{stopCam();show('cam')};

$('camSel').onchange=async e=>{

  try{await openCam(id);rememberCam(await listCams())}
  catch(err){console.error(err);toast('這顆鏡頭無法使用');ls.del(LSK.cam);ls.del(LSK.camLabel);try{await openCam(null)}catch{}}
  const cur=track&&track.getSettings().deviceId;if(cur)$('camSel').value=cur;
};
const zkey=()=>LSK.zoom+':'+((track&&track.getSettings().deviceId)||'');
function setupZoom(caps){
  const z=caps.zoom,box=$('zoomBar'),r=$('zoom');
  if(!z||!(z.max>z.min)){box.style.display='none';return}
  r.min=z.min;r.max=z.max;r.step=z.step||0.1;
  let v=parseFloat(ls.get(zkey()));
  if(!(v>=z.min&&v<=z.max))v=track.getSettings().zoom||z.min;
  r.value=v;applyZoom(v);box.style.display='flex';
}
function applyZoom(v){
  $('zoomVal').textContent=(+v).toFixed(1)+'×';
  if(track)track.applyConstraints({advanced:[{zoom:+v}]}).catch(()=>{});
}
$('zoom').oninput=e=>{applyZoom(e.target.value);ls.set(zkey(),e.target.value)};

async function stillBlob(){
  const ic=new ImageCapture(track);
  let s={};
  try{
    const pc=await ic.getPhotoCapabilities(),W=pc.imageWidth,H=pc.imageHeight;
    if(W&&H&&W.max>0&&H.max>0){   // 靜態照限制在約 2560px，避免超高畫素解碼太慢
      const tw=clamp(2560,W.min,W.max);
      s={imageWidth:tw,imageHeight:clamp(Math.round(tw*H.max/W.max),H.min,H.max)};
    }
  }catch{}
  try{return await ic.takePhoto(s)}catch{return await ic.takePhoto()}
}
async function snap(){
  if(!track||shooting)return;
  shooting=true;$('shutter').disabled=true;
  try{
    let blob=null;
    if('ImageCapture'in window){try{blob=await stillBlob()}catch(e){console.warn(e)}}
    if(blob){
      const url=URL.createObjectURL(blob),im=new Image();
      const ok=await new Promise(res=>{im.onload=()=>res(true);im.onerror=()=>res(false);im.src=url});
      URL.revokeObjectURL(url);
      if(ok){stopCam();run(im,im.naturalWidth,im.naturalHeight);return}
    }
    const v=$('live');                 // 不支援 takePhoto：直接擷取預覽畫面
    if(v.videoWidth){run(v,v.videoWidth,v.videoHeight);stopCam()}
  }finally{shooting=false;$('shutter').disabled=false}
}
$('shutter').onclick=snap;
document.addEventListener('visibilitychange',()=>{

/* ---------- word boxes + selection ---------- */
function clearBoxes(){stage.querySelectorAll('.w').forEach(e=>e.remove());boxEls=[]}
function buildBoxes(){
  clearBoxes();
  words.forEach(w=>{
    const b=w.bbox,d=document.createElement('div');d.className='w'+(w.low?' lo':'');
    d.style.cssText=`left:${b.x0/imgW*100}%;top:${b.y0/imgH*100}%;width:${(b.x1-b.x0)/imgW*100}%;height:${(b.y1-b.y0)/imgH*100}%`;
    stage.appendChild(d);boxEls.push(d);
  });
}
const CJK=/[\u2e80-\u9fff\uff00-\uffef\u3000-\u303f]/;
function joinWords(idx){
  let s='',prev='';
  idx.forEach(i=>{
    const t=words[i].text;
    if(s&&!(CJK.test(prev.slice(-1))||CJK.test(t[0])))s+=' ';
    s+=t;prev=t;
  });return s;
}
function textFor(set){
  const out=[];
  lines.forEach(l=>{const pick=l.filter(i=>!set||set.has(i));if(pick.length)out.push(joinWords(pick))});
  return fmt(out);
}
const PM={',':'，','.':'。',':':'：',';':'；','!':'！','?':'？'};
function fmt(arr){
  let s;
  if($('oBreak').checked)s=arr.join('\n');
  else s=arr.reduce((a,t)=>!a?t:a+((CJK.test(a.slice(-1))||CJK.test(t[0]))?'':' ')+t,'');
  if($('oSpace').checked)s=s.replace(/([\u2e80-\u9fff\uff00-\uffef])[ \t]+(?=[\u2e80-\u9fff\uff00-\uffef])/g,'$1');
  if($('oPunc').checked)s=s.replace(/([\u3400-\u9fff])[ \t]*([,.:;!?])/g,(m,a,p)=>a+PM[p]);
  return s;
}
function refresh(){
  boxEls.forEach((e,i)=>e.classList.toggle('s',sel.has(i)));
  txt.value=textFor(sel.size?sel:null);
  const lo=words.filter(w=>w.low).length;
  $('count').textContent=(sel.size?`已選 ${sel.size} 字詞`:`全部 ${words.length} 字詞`)+(lo?` · ${lo} 低信心`:'')+(lastInfo?` · ${lastInfo}`:'');
}
/* ---------- result view: pinch/wheel zoom, pan, drag-select ---------- */
const wrap=$('imgWrap');
let vs=1,vx=0,vy=0,moveMode=false,p0=null,pinch=null,pan=null;const ptrs=new Map();
function fit(){
  const cw=wrap.clientWidth,ch=wrap.clientHeight;if(!cw||!ch||!imgW)return;
  const f=Math.min(cw/imgW,ch/imgH);
  stage.style.width=imgW*f+'px';stage.style.height=imgH*f+'px';
  vs=1;clampView();applyView();
}
function clampView(){
  const cw=wrap.clientWidth,ch=wrap.clientHeight,sw=stage.offsetWidth*vs,sh=stage.offsetHeight*vs;
  vx=sw<=cw?(cw-sw)/2:clamp(vx,cw-sw,0);
  vy=sh<=ch?(ch-sh)/2:clamp(vy,ch-sh,0);
}
function applyView(){stage.style.transform=`translate(${vx}px,${vy}px) scale(${vs})`}
function zoomAt(ns,cx,cy){ns=clamp(ns,1,10);const ax=(cx-vx)/vs,ay=(cy-vy)/vs;vs=ns;vx=cx-ax*vs;vy=cy-ay*vs;clampView();applyView()}
addEventListener('resize',fit);
$('mZ').onclick=()=>zoomAt(vs*1.5,wrap.clientWidth/2,wrap.clientHeight/2);
$('mO').onclick=()=>zoomAt(vs/1.5,wrap.clientWidth/2,wrap.clientHeight/2);
$('mFit').onclick=fit;
$('mMove').onclick=e=>{moveMode=!moveMode;e.currentTarget.classList.toggle('pri',moveMode);wrap.classList.toggle('mv',moveMode)};
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(vs*Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});

function fr(e){const r=stage.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width,0,1),y:clamp((e.clientY-r.top)/r.height,0,1),cx:e.clientX,cy:e.clientY}}
const pdist=()=>{const [a,b]=[...ptrs.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
function cancelSel(){p0=null;rectEl.style.display='none'}
wrap.addEventListener('pointerdown',e=>{
  if(e.target.closest('#zc'))return;
  wrap.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    cancelSel();pan=null;
    const [a,b]=[...ptrs.values()],r=wrap.getBoundingClientRect();
    pinch={d:pdist(),s:vs,ax:((a.x+b.x)/2-r.left-vx)/vs,ay:((a.y+b.y)/2-r.top-vy)/vs};
  }else if(ptrs.size===1){
    if(moveMode)pan={x:e.clientX,y:e.clientY,vx,vy};
    else{p0=fr(e);drawRect(p0,p0)}
  }
});
wrap.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()],r=wrap.getBoundingClientRect();
    vs=clamp(pinch.s*pdist()/pinch.d,1,10);
    vx=(a.x+b.x)/2-r.left-pinch.ax*vs;vy=(a.y+b.y)/2-r.top-pinch.ay*vs;
    clampView();applyView();
  }else if(pan){vx=pan.vx+e.clientX-pan.x;vy=pan.vy+e.clientY-pan.y;clampView();applyView()}
  else if(p0)drawRect(p0,fr(e));
});
function endPtr(e,cancel){
  if(!ptrs.has(e.pointerId))return;
  if(p0&&!cancel&&ptrs.size===1)finishSel(fr(e));
  ptrs.delete(e.pointerId);cancelSel();
  if(ptrs.size<2)pinch=null;
  if(!ptrs.size)pan=null;
}
wrap.addEventListener('pointerup',e=>endPtr(e,false));
wrap.addEventListener('pointercancel',e=>endPtr(e,true));
function finishSel(p1){
  const moved=Math.hypot(p1.cx-p0.cx,p1.cy-p0.cy)>8;
  if(moved){
    const x0=Math.min(p0.x,p1.x)*imgW,x1=Math.max(p0.x,p1.x)*imgW,y0=Math.min(p0.y,p1.y)*imgH,y1=Math.max(p0.y,p1.y)*imgH;
    lastRect={x0,y0,x1,y1};updateBtns();
    sel=new Set();
    words.forEach((w,i)=>{const b=w.bbox,ix=Math.min(x1,b.x1)-Math.max(x0,b.x0),iy=Math.min(y1,b.y1)-Math.max(y0,b.y0);
      if(ix>0&&iy>0&&ix*iy>=.4*(b.x1-b.x0)*(b.y1-b.y0))sel.add(i)});
  }else{
    const x=p1.x*imgW,y=p1.y*imgH;let hit=-1,best=1e9;
    words.forEach((w,i)=>{const b=w.bbox,dx=Math.max(b.x0-x,0,x-b.x1),dy=Math.max(b.y0-y,0,y-b.y1),d=dx*dx+dy*dy;if(d<best){best=d;hit=i}});
    if(hit>=0&&best<(imgW*.03/vs)**2)sel.has(hit)?sel.delete(hit):sel.add(hit);
  }
  refresh();
}
function drawRect(a,b){Object.assign(rectEl.style,{display:'block',left:Math.min(a.x,b.x)*100+'%',top:Math.min(a.y,b.y)*100+'%',width:Math.abs(a.x-b.x)*100+'%',height:Math.abs(a.y-b.y)*100+'%'})}

$('selAll').onclick=()=>{sel=new Set(words.map((_,i)=>i));refresh()};
$('clear').onclick=()=>{sel.clear();refresh()};

/* ---------- 螢幕擷取辨識（getDisplayMedia） ---------- */
let snipR=null,snipP0=null;
if(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)$('snipBtn').style.display='';
async function grabScreen(){
  const st=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:5}},audio:false});
  try{
    const v=document.createElement('video');v.muted=true;v.playsInline=true;v.srcObject=st;
    await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=rej;setTimeout(()=>rej(new Error('timeout')),6000)});
    await v.play();
    await new Promise(r=>setTimeout(r,350));   // 等分享提示收掉、畫面穩定
    if(v.requestVideoFrameCallback)await Promise.race([new Promise(r=>v.requestVideoFrameCallback(()=>r())),new Promise(r=>setTimeout(r,800))]);
    const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
    c.getContext('2d').drawImage(v,0,0);
    return c;
  }finally{st.getTracks().forEach(t=>t.stop())}
}
function fitSnip(){
  const cv=$('snipCv'),box=$('snipBox');if(!cv.width||!box.clientWidth)return;
  const f=Math.min(box.clientWidth/cv.width,box.clientHeight/cv.height,1);
  cv.style.width=Math.floor(cv.width*f)+'px';cv.style.height=Math.floor(cv.height*f)+'px';
}
async function snipStart(){
  stopCam();
  let c;
  try{c=await grabScreen()}
  catch(e){if(e&&e.name==='NotAllowedError')toast('已取消擷取');else{console.error(e);toast('無法擷取螢幕')}return}
  if(!c.width||!c.height){toast('擷取到空白畫面');return}
  const cv=$('snipCv');cv.width=c.width;cv.height=c.height;cv.getContext('2d').drawImage(c,0,0);
  snipR=null;snipP0=null;$('snipSel').style.display='none';$('snipGo').disabled=true;
  show('snip');fitSnip();
}
function snipRun(full){
  const cv=$('snipCv'),r=(full||!snipR)?{x0:0,y0:0,x1:cv.width,y1:cv.height}:snipR;
  const x=Math.round(r.x0),y=Math.round(r.y0),w=Math.max(1,Math.round(r.x1-r.x0)),h=Math.max(1,Math.round(r.y1-r.y0));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(cv,x,y,w,h,0,0,w,h);
  lastMode='screen';$('retake').textContent='重新擷取';
  run(c,w,h);                      // run 會先同步複製像素，之後才釋放擷取畫面
  cv.width=1;cv.height=1;
}
{
  const sw=$('snipWrap'),sp=e=>{const r=sw.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width,0,1),y:clamp((e.clientY-r.top)/r.height,0,1)}};
  const draw=(a,b)=>Object.assign($('snipSel').style,{display:'block',left:Math.min(a.x,b.x)*100+'%',top:Math.min(a.y,b.y)*100+'%',width:Math.abs(a.x-b.x)*100+'%',height:Math.abs(a.y-b.y)*100+'%'});
  sw.addEventListener('pointerdown',e=>{sw.setPointerCapture(e.pointerId);snipP0=sp(e);snipR=null;$('snipGo').disabled=true;draw(snipP0,snipP0)});
  sw.addEventListener('pointermove',e=>{if(snipP0)draw(snipP0,sp(e))});
  sw.addEventListener('pointerup',e=>{
    if(!snipP0)return;
    const p1=sp(e),W=$('snipCv').width,H=$('snipCv').height;
    const x0=Math.min(snipP0.x,p1.x)*W,x1=Math.max(snipP0.x,p1.x)*W,y0=Math.min(snipP0.y,p1.y)*H,y1=Math.max(snipP0.y,p1.y)*H;
    snipP0=null;
    if(x1-x0>=8&&y1-y0>=8){snipR={x0,y0,x1,y1};$('snipGo').disabled=false}
    else{$('snipSel').style.display='none';snipR=null}
  });
  sw.addEventListener('pointercancel',()=>{snipP0=null});
}
$('snipBtn').onclick=snipStart;
$('snipBack').onclick=()=>{$('snipCv').width=1;$('snipCv').height=1;show('cam')};
$('snipAll').onclick=()=>snipRun(true);
$('snipGo').onclick=()=>snipRun(false);
addEventListener('resize',()=>{if($('snip').classList.contains('on'))fitSnip()});
addEventListener('keydown',e=>{
  if(!$('snip').classList.contains('on'))return;
  if(e.key==='Enter'){e.preventDefault();snipRun(false)}
  else if(e.key==='Escape')$('snipBack').click();
});

/* ---------- 引擎選擇（兩處下拉同步、記住選擇） ---------- */
const engSels=[$('eng'),$('eng2')];
function syncEngUI(){
  const t=engine()==='tess';
  $('enhLbl').style.opacity=t?'':'.45';
  engSels.forEach(x=>{x.title=ppBroken?'高準確引擎無法載入，目前使用 Tesseract（重新選擇可再試）':''});
}
{const sv=ls.get(LSK.eng);if(sv&&[...$('eng').options].some(o=>o.value===sv))engSels.forEach(x=>x.value=sv)}
engSels.forEach(x=>x.onchange=()=>{
  engSels.forEach(y=>y.value=x.value);ls.set(LSK.eng,x.value);ppBroken=false;syncEngUI();
  if(x===$('eng2')&&orig)ocrFull();else warm();
});
syncEngUI();
// 加速方式：沒有 WebGPU 的瀏覽器直接隱藏；切換後重開背景執行緒並重辨，方便比較
{
  const sv=ls.get(LSK.acc);if(sv==='cpu'||sv==='auto')$('acc').value=sv;
  if(!navigator.gpu)$('accLbl').style.display='none';
  $('acc').onchange=()=>{
    ls.set(LSK.acc,$('acc').value);
    if(pw){pw.terminate();pw=null;pwP=null;ppBackend=''}
    if(orig&&engine()!=='tess')ocrFull();
  };
}

/* ---------- PC: paste / drag-drop / shortcuts / options ---------- */
$('reBtn').onclick=reocr;
addEventListener('paste',e=>{
  const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(x=>x.kind==='file'&&x.type.startsWith('image/'));
  const f=it&&it.getAsFile();if(!f)return;
  e.preventDefault();loadFile(f);
});
{
  let dn=0;const hasFiles=e=>[...(e.dataTransfer&&e.dataTransfer.types||[])].includes('Files');
  addEventListener('dragenter',e=>{if(hasFiles(e)){dn++;$('drop').classList.add('on')}});
  addEventListener('dragleave',()=>{if(--dn<=0){dn=0;$('drop').classList.remove('on')}});
  addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()});
  addEventListener('drop',e=>{
    if(!hasFiles(e))return;
    e.preventDefault();dn=0;$('drop').classList.remove('on');
    const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/'));
    if(f)loadFile(f);else toast('請拖入圖片檔');
  });
}
addEventListener('keydown',e=>{
  if(!$('res').classList.contains('on'))return;
  const inTxt=document.activeElement===txt,mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='a'&&!inTxt){e.preventDefault();$('selAll').click()}
  else if(mod&&k==='c'&&!String(getSelection())&&(!inTxt||txt.selectionStart===txt.selectionEnd)){e.preventDefault();$('copy').click()}
  else if(e.key==='Escape'&&!inTxt)$('clear').click();
});
{
  const OPT=['oBreak','oSpace','oPunc','oEnh'];
  try{const o=JSON.parse(ls.get('ocrOpts')||'{}');OPT.forEach(id=>{if(id in o)$(id).checked=!!o[id]})}catch{}
  OPT.forEach(id=>$(id).onchange=()=>{
    ls.set('ocrOpts',JSON.stringify(Object.fromEntries(OPT.map(i=>[i,$(i).checked]))));
    if(id==='oEnh'){if(orig&&engine()==='tess')ocrFull()}else refresh();
  });
}

/* ---------- PWA: install / update / offline ---------- */
let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('install').style.display='inline-block'});
$('install').onclick=async()=>{if(!dip)return;dip.prompt();await dip.userChoice;dip=null;$('install').style.display='none'};
addEventListener('appinstalled',()=>{$('install').style.display='none'});
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone&&!localStorage.getItem('iosHint')){$('ios').style.display='block'}
$('iosX').onclick=()=>{$('ios').style.display='none';try{localStorage.setItem('iosHint','1')}catch{}};

function netState(){
  const on=navigator.onLine;
  $('net').textContent=(on?'':'離線 · ')+(offlineReady?'可離線使用':'首次載入中…');
}
let offlineReady=false;
addEventListener('online',netState);addEventListener('offline',netState);
async function checkOffline(){
  try{offlineReady=!!(await caches.match('vendor/lang/chi_tra.traineddata.gz'))&&!!(await caches.match('vendor/core/tesseract-core-simd-lstm.wasm.js'))}catch{}
  netState();
  if(offlineReady)idleWarm();
}
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const offer=w=>{$('upd').style.display='flex';$('updBtn').onclick=()=>w.postMessage('SKIP_WAITING')};
    if(reg.waiting&&navigator.serviceWorker.controller)offer(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w.addEventListener('statechange',()=>{
      if(w.state==='installed'&&navigator.serviceWorker.controller)offer(w);
      if(w.state==='activated')checkOffline();
    })});
    // look for a new version whenever the app comes back to the foreground
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{});
  const hadCtl=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl||reloaded)return;reloaded=true;location.reload()});
  navigator.serviceWorker.ready.then(checkOffline);
}else netState();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* ---------- boot ---------- */
netState();
